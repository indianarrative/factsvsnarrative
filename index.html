<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Facts Vs Narrative</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f4f6f9;
      color:#222;
      line-height:1.6;
    }

    /* NAVBAR */

    nav{
      background:#001f3f;
      padding:0 30px;
      position:sticky;
      top:0;
      z-index:1000;
    }

    .menu{
      display:flex;
      list-style:none;
      align-items:center;
    }

    .menu li{
      position:relative;
    }

    .menu > li > a{
      display:block;
      color:white;
      padding:18px 22px;
      text-decoration:none;
      font-weight:bold;
    }

    .menu > li > a:hover{
      background:#003366;
    }

    /* DROPDOWN */

    .dropdown{
      display:none;
      position:absolute;
      background:white;
      min-width:250px;
      top:55px;
</html>
